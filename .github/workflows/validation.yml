name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Syntax Checks
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible>=9.4.0" ansible-lint yamllint

      - name: Run Makefile validation
        run: make check

  integration:
    name: Integration Test
    runs-on: [self-hosted, macOS]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      VAGRANT_IGNORE_WINRM_PLUGIN: YES
    steps:
      - name: Cleanup Stale VMs
        run: |
          echo "Cleaning up stale VirtualBox VMs..."
          VMS=$(VBoxManage list vms | grep "kitchen-windows-base" | awk -F'"' '{print $2}' || true)
          for VM in $VMS; do
            VBoxManage controlvm "$VM" poweroff || true
            VBoxManage unregistervm "$VM" --delete || true
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          bundle config set --local path 'vendor/bundle'
          bundle install
          export PATH=$PWD/.venv/bin:$PATH
          bundle exec make deps

      - name: Workaround Vagrant Bundler Conflict
        run: |
          mkdir -p $HOME/.local/bin
          cat <<'EOF' > $HOME/.local/bin/vagrant
          #!/bin/bash
          ENV_ARGS=(HOME="$HOME" PATH="/opt/vagrant/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" TERM="${TERM:-dumb}" LANG="${LANG:-en_US.UTF-8}" USER="$USER" SHELL="$SHELL" TMPDIR="${TMPDIR:-/tmp}")
          [[ -n "${SSH_AUTH_SOCK:-}" ]] && ENV_ARGS+=( SSH_AUTH_SOCK="$SSH_AUTH_SOCK" )
          exec /usr/bin/env -i "${ENV_ARGS[@]}" /usr/local/bin/vagrant "$@"
          EOF
          chmod +x $HOME/.local/bin/vagrant
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Test
        run: |
          source .venv/bin/activate
          python3 - <<'EOF'
          import os, re, sys
          ansible_path = os.path.abspath('.venv/bin/ansible-playbook')
          if not os.path.exists(ansible_path):
              print(f"Error: {ansible_path} not found")
              sys.exit(1)
          kitchen_files = ['.kitchen.yml', '.kitchen-win.yml']
          robust_verifier = """ |
                  echo "Waiting for service to respond on port 8080..."
                  for i in {1..12}; do
                    if curl -s --connect-timeout 5 -f http://localhost:8080 || curl -s --connect-timeout 5 http://localhost:8080 | grep -q "404"; then
                      echo "Service is UP!"
                      exit 0
                    fi
                    echo "Still waiting ($i/12)..."
                    sleep 10
                  done
                  echo "ERROR: Service failed to respond after 2 minutes"
                  exit 1"""
          for kfile in kitchen_files:
              if not os.path.exists(kfile): continue
              with open(kfile, 'r') as f: content = f.read()
              # 1. Fix Kitchen/Ansible connection port (Host side)
              content = content.replace('port: 5985', 'port: 25985')
              content = content.replace('ansible_port: 5985', 'ansible_port: 25985')
              # 2. Fix Vagrant Port Forwarding (Host side)
              if 'communicator: winrm' in content:
                  winrm_net = 'communicator: winrm\n      network:\n        - ["forwarded_port", {guest: 5985, host: 25985, id: "winrm"}]'
                  content = content.replace('communicator: winrm', winrm_net)
              # 3. Fix Ansible binary path
              if 'ansible_playbook_bin:' in content:
                  content = re.sub(r'ansible_playbook_bin:.*', f'ansible_playbook_bin: {ansible_path}', content)
              else:
                  content = content.replace('name: ansible_push', f'name: ansible_push\n      ansible_playbook_bin: {ansible_path}')
              # 4. Fix WinRM stability
              content = content.replace('connection_retries: 5', 'connection_retries: 15')
              content = content.replace('connection_retry_sleep: 10', 'connection_retry_sleep: 20')
              # 5. Inject robust verifier
              content = re.sub(r'command: \|.*?(?=\n\n|\n[a-z]|\Z)', f'command: {robust_verifier}', content, flags=re.DOTALL)
              with open(kfile, 'w') as f: f.write(content)
              print(f"Patched {kfile}")
          EOF
          bundle exec kitchen test

      - name: Post-Test Cleanup
        if: always()
        run: |
          VMS=$(VBoxManage list vms | grep "kitchen-windows-base" | awk -F'"' '{print $2}' || true)
          for VM in $VMS; do
            VBoxManage controlvm "$VM" poweroff || true
            VBoxManage unregistervm "$VM" --delete || true
          done
